<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контент-план — календарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2559; --gold:#C9973E; --green:#1D8A5C; --red:#C24545; --amber:#D9A441;
    --bg:#F7F8FB; --line:#E5E7EB; --muted:#6B7280;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--bg); color:#1F2937;}
  .display{font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:1280px; margin:0 auto; padding:40px 24px;}

  header{margin-bottom:28px;}
  .eyebrow{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:6px;}
  h1{font-size:26px; color:var(--navy); font-weight:700;}
  .sub{font-size:13px; color:var(--muted); margin-top:4px;}

  .summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px;}
  .kpi{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .kpi .n{font-size:22px; font-weight:700; color:var(--navy); font-family:'Space Grotesk',sans-serif;}
  .kpi .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .kpi.warn .n{color:var(--red);}

  .panel{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:24px; overflow-x:auto;}
  .panel h2{font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); font-weight:600; margin-bottom:16px;}

  table.gantt{border-collapse:collapse; width:100%; font-size:12px;}
  table.gantt th{padding:6px 8px; text-align:center; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line); white-space:nowrap;}
  table.gantt td{padding:4px; border-bottom:1px solid #F3F4F6; vertical-align:middle;}
  .row-label{white-space:nowrap; padding-right:14px !important; font-size:12px;}
  .row-label b{color:var(--navy); display:block;}
  .row-label span{color:var(--muted); font-size:11px;}
  .today-col{background:#FFFBF2;}
  .cell{height:26px; position:relative;}
  .bar{position:absolute; top:4px; bottom:4px; left:2px; right:2px; border-radius:4px;}
  .bar.perf{background:#2C3E7A;}
  .bar.media{background:#8B6FB3;}
  .bar.done{opacity:.35;}
  .marker{position:absolute; top:50%; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:2px; z-index:2;}
  .marker.overdue{background:var(--red);}
  .marker.soon{background:var(--amber);}

  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:12px;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:9px; height:9px; border-radius:2px; display:inline-block;}

  .conflict-list{list-style:none;}
  .conflict-list li{padding:9px 0; border-bottom:1px solid #F3F4F6; font-size:13px; display:flex; gap:10px; align-items:flex-start;}
  .conflict-list li:last-child{border-bottom:none;}
  .tag{font-size:10px; font-weight:600; padding:2px 7px; border-radius:100px; white-space:nowrap; margin-top:1px;}
  .tag.high{background:#FDE2E2; color:var(--red);}
  .tag.mid{background:#FDF3D9; color:#946E1F;}
  .tag.low{background:#E9ECF5; color:var(--navy);}

  .digest{white-space:pre-wrap; font-size:13px; line-height:1.7;}
  .digest b{color:var(--navy);}

  .empty{color:var(--muted); font-size:12px; padding:8px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Digital Content Plan</p>
    <h1 class="display">Контент-план — календарь</h1>
    <p class="sub" id="subline"></p>
  </header>

  <div class="summary" id="summary"></div>

  <div class="panel">
    <h2>Календарная сетка по неделям</h2>
    <table class="gantt" id="gantt"></table>
    <div class="legend">
      <span><i class="dot" style="background:#2C3E7A"></i> Перформанс-кампания</span>
      <span><i class="dot" style="background:#8B6FB3"></i> Медийка</span>
      <span><i class="dot" style="background:var(--red)"></i> Просроченный дедлайн внутри недели</span>
      <span><i class="dot" style="background:var(--amber)"></i> Дедлайн в ближайшие 7 дней</span>
      <span>Тусклая заливка — статус «Готово»</span>
    </div>
  </div>

  <div class="panel">
    <h2>Недельный дайджест</h2>
    <div class="digest" id="digest"></div>
  </div>

  <div class="panel">
    <h2>Отчёт проверок — найденные риски</h2>
    <ul class="conflict-list" id="conflicts"></ul>
  </div>
</div>

function isoWeek(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = (target - firstThursday) / 86400000;
  const week = 1 + Math.round(diff / 7);
  return `${target.getFullYear()}-W${String(week).padStart(2,"0")}`;
}

function buildWeekRange(campaigns, today){
  const weeks = new Set([isoWeek(today)]);
  campaigns.forEach(c => {
    if (c["Старт"]) weeks.add(isoWeek(c["Старт"]));
    if (c["Финиш"]) weeks.add(isoWeek(c["Финиш"]));
  });
  const sorted = Array.from(weeks).sort();
  // fill gaps between min and max week label so the grid has no holes
  const [minY, minW] = sorted[0].split("-W").map((v,i)=> i===0?parseInt(v):parseInt(v));
  const first = sorted[0], last = sorted[sorted.length-1];
  let [fy, fw] = first.split("-W"); fy=+fy; fw=+fw;
  let [ly, lw] = last.split("-W"); ly=+ly; lw=+lw;
  const range = [];
  let y=fy, w=fw;
  while (y < ly || (y===ly && w<=lw)){
    range.push(`${y}-W${String(w).padStart(2,"0")}`);
    w++; if(w>52){w=1; y++;}
  }
  return range;
}

function render(){
  const campaigns = DATA.campaigns;
  const report = DATA.conflict_report;
  const today = DATA.generated_at;
  const todayWeek = isoWeek(today);
  const weeks = buildWeekRange(campaigns, today);

  document.getElementById("subline").textContent =
    `Сгенерировано на ${today} · ${campaigns.length} активностей · неделя сегодня: ${todayWeek}`;

  // summary KPIs
  const overdueIds = new Set(report.overdue.map(r=>r.id));
  const kpis = [
    {n: campaigns.length, l: "активностей всего"},
    {n: overdueIds.size, l: "с просрочкой", warn: overdueIds.size>0},
    {n: report.missing_creative.length, l: "без креатива, старт < 7 дн", warn: report.missing_creative.length>0},
    {n: report.model_coverage_gap.length, l: "моделей без покрытия", warn: report.model_coverage_gap.length>0},
    {n: report.recalculated_vs_flat.length, l: "дедлайнов пересчитано"},
  ];
  document.getElementById("summary").innerHTML = kpis.map(k =>
    `<div class="kpi ${k.warn?'warn':''}"><div class="n">${k.n}</div><div class="l">${k.l}</div></div>`
  ).join("");

  // gantt table
  const byId = {}; campaigns.forEach(c => byId[c.ID]=c);
  const deadlineKeys = ["Бриф до (пересчитано)","Креатив до (пересчитано)","Согл. до (пересчитано)","Загрузка до (пересчитано)"];

  let thead = "<tr><th style='text-align:left'>Кампания</th>" + weeks.map(w=>`<th>${w.split("-W")[1]}</th>`).join("") + "</tr>";
  let rows = "";
  campaigns.forEach(c => {
    const startWk = c["Старт"] ? isoWeek(c["Старт"]) : null;
    const finishWk = c["Финиш"] ? isoWeek(c["Финиш"]) : startWk;
    const isMedia = c["Тип кампании"] === "Медийка";
    const isDone = c["Статус"] === "Готово";
    let cells = "";
    weeks.forEach(w => {
      const inRange = startWk && finishWk && w >= startWk && w <= finishWk;
      let markers = "";
      deadlineKeys.forEach(k => {
        const due = c[k];
        if (due && isoWeek(due) === w) {
          const isOverdue = overdueIds.has(c.ID) && due < today;
          const isSoon = due >= today;
          markers += `<div class="marker ${isOverdue?'overdue':(isSoon?'soon':'')}" style="left:${20+Math.random()*10}%" title="${k}: ${due}"></div>`;
        }
      });
      cells += `<td class="cell ${w===todayWeek?'today-col':''}">${inRange ? `<div class="bar ${isMedia?'media':'perf'} ${isDone?'done':''}" title="${c.ID} — ${c['Модель']}"></div>`:''}${markers}</td>`;
    });
    rows += `<tr><td class="row-label"><b>${c.ID}</b><span>${c["Модель"]} · ${c["Канал"]}</span></td>${cells}</tr>`;
  });
  document.getElementById("gantt").innerHTML = thead + rows;

  // digest
  const by = id => byId[id] || {};
  let digestHtml = `<b>🔥 Что горит</b>\n`;
  const seenOverdue = new Set();
  report.overdue.forEach(o => {
    if (seenOverdue.has(o.id)) return; seenOverdue.add(o.id);
    digestHtml += `— ${o.id} (${by(o.id)["Модель"]||''}) — просрочен этап «${o.этап}»\n`;
  });
  if (seenOverdue.size===0) digestHtml += "— просрочек нет\n";

  digestHtml += `\n<b>📋 На этой неделе</b>\n`;
  if (report.missing_creative.length===0) digestHtml += "— срочных задач нет\n";
  report.missing_creative.slice(0,8).forEach(m => {
    digestHtml += `— ${m.id} (${by(m.id)["Модель"]||''}) — старт ${m.старт}, статус «${m.статус}»\n`;
  });

  digestHtml += `\n<b>🕳️ Где дыры</b>\n`;
  let gaps = 0;
  report.model_media_without_perf.forEach(g => {
    gaps++; digestHtml += `— ${g.модель}: медийка (${g.кампании.join(", ")}) без перформанс-поддержки\n`;
  });
  report.model_coverage_gap.forEach(g => {
    gaps++; digestHtml += `— ${g.модель}: ${g.проблема}\n`;
  });
  if (gaps===0) digestHtml += "— дыр не найдено\n";
  document.getElementById("digest").innerHTML = digestHtml;

  // conflict list
  let html = "";
  report.recalculated_vs_flat.forEach(c => {
    html += `<li><span class="tag high">Ошибка в файле</span> <span>${c.детали}</span></li>`;
  });
  report.model_media_without_perf.forEach(c => {
    html += `<li><span class="tag mid">Медийка без перформанса</span> <span>Модель ${c.модель}: ${c.кампании.join(", ")}</span></li>`;
  });
  report.model_coverage_gap.forEach(c => {
    html += `<li><span class="tag mid">Нет покрытия</span> <span>Модель ${c.модель}: ${c.проблема}</span></li>`;
  });
  if (report.week_overload.length===0) {
    html += `<li><span class="tag low">Перегруз недели</span> <span>Не найдено — максимум 3 запуска/неделю</span></li>`;
  }
  document.getElementById("conflicts").innerHTML = html || "<div class='empty'>Конфликтов не найдено.</div>";
}
